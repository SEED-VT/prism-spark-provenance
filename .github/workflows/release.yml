# Publishes a release when a tag such as v0.0.1 is pushed. It runs the full CI first,
# then attaches the jars to a GitHub Release and pushes the demo image to GHCR. The
# release notes are the message of the annotated tag.
#
#   git tag -a v0.0.1 -m "<release notes>"
#   git push origin v0.0.1

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  jars:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check that the tag matches the build version
        run: |
          v=$(sed -n 's/.*version := "\(.*\)"/\1/p' build.sbt)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in build.sbt"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the jars
        run: |
          sbt -batch package
          sh scripts/fetch-fastutil.sh

      - name: Collect the release files
        run: |
          mkdir dist
          cp "target/scala-2.13/prism_2.13-$VERSION.jar" jars/fastutil-8.5.15.jar dist/
          (cd dist && sha256sum -- *.jar > SHA256SUMS)
          # checkout does not keep the annotated tag object, so fetch it for its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*

  image:
    name: Demo image on GHCR
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/seed-vt/prism-demo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Prism demo
            org.opencontainers.image.description=Prism on Apache Spark 4.1.2 with JupyterLab and the demo notebooks

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

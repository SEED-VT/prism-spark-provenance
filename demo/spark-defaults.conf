# Prism attaches to stock Spark through this extension. Its jar must be on the system
# classpath of the driver and of every executor, because the lineage lookup ships code
# that Spark deserializes with the system class loader.
spark.sql.extensions              org.apache.spark.sql.lineage.PrismSQLExtension
spark.driver.extraClassPath       /opt/prism/jars/prism.jar:/opt/prism/jars/fastutil.jar
spark.executor.extraClassPath     /opt/prism/jars/prism.jar:/opt/prism/jars/fastutil.jar
spark.driver.extraJavaOptions     @OPENS@
spark.executor.extraJavaOptions   @OPENS@
spark.dynamicAllocation.enabled   false
spark.ui.showConsoleProgress      false
spark.sql.shuffle.partitions      8
